server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Needed because proxy_pass below uses a variable in its target, which
    # makes nginx resolve the upstream hostname at request time instead of
    # once at startup.
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    set $ssr_upstream https://elevate-careers-api.fly.dev;
    proxy_ssl_server_name on;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /landing-page.html {
        try_files $uri =404;
    }

    location = / {
        # Known AI/search crawler user agents get a server-rendered HTML page
        # with real content (see /ssr/* on the API) instead of the SPA shell,
        # since most of them don't execute JavaScript.
        if ($http_user_agent ~* "GPTBot|ChatGPT-User|ClaudeBot|anthropic-ai|PerplexityBot|Perplexity-User|Google-Extended|CCBot|Amazonbot|Applebot|Bytespider|Googlebot|bingbot|Slurp|DuckDuckBot|facebookexternalhit|Twitterbot|LinkedInBot|Slackbot") {
            proxy_pass $ssr_upstream/ssr/home;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/companies/([a-zA-Z0-9-]+)/?$ {
        # Capture $1 into a named variable immediately — regex captures get
        # reset by any later regex evaluation in the same request (including
        # the `if` condition's own regex below, even though it has no capture
        # groups), so reading $1 later would silently be empty.
        set $slug $1;
        if ($http_user_agent ~* "GPTBot|ChatGPT-User|ClaudeBot|anthropic-ai|PerplexityBot|Perplexity-User|Google-Extended|CCBot|Amazonbot|Applebot|Bytespider|Googlebot|bingbot|Slurp|DuckDuckBot|facebookexternalhit|Twitterbot|LinkedInBot|Slackbot") {
            proxy_pass $ssr_upstream/ssr/companies/$slug;
        }
        try_files $uri $uri/ /index.html;
    }

    # Handle React routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}