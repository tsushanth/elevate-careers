app = 'elevate-playwright-worker'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'
  dockerignore_file = '.dockerignore'

[env]
  NODE_ENV = 'production'

# Worker — no HTTP service. Keep exactly 1 machine running at all times.
[machines]
  min_machines_running = 1

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
