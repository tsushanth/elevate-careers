<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Job Autofill – Options</title>
  <style>
    body { font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
    h1 { font-size: 18px; }
    textarea, input[type=text] { width: 100%; box-sizing: border-box; }
    .row { margin: 14px 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
    button { padding: 8px 12px; border-radius: 8px; border: 1px solid #e5e7eb; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Job Autofill – Options</h1>

  <div class="grid">
    <div class="card">
      <h2>Enabled Sites</h2>
      <div class="row">
        <label><input type="checkbox" id="autoInject"> Auto-inject widget on enabled sites</label>
      </div>
      <div class="row">
        <label>Host Regex (one per line)</label><br/>
        <textarea id="hosts" rows="8"></textarea>
      </div>
      <div class="row">
        <button id="saveHosts">Save Sites</button>
      </div>
    </div>

    <div class="card">
      <h2>Profile</h2>
      <div class="row">
        <label>Profile JSON</label><br/>
        <textarea id="profile" rows="16"></textarea>
      </div>
      <div class="row">
        <button id="saveProfile">Save Profile</button>
      </div>
    </div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
